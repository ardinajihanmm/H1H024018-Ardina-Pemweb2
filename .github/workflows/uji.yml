name: Uji Modul 10

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uji-laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: latihan-laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - run: php artisan test --testsuite=Feature

  uji-fiber:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: latihan-fiber-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: latihan-fiber-api/go.mod
          cache-dependency-path: latihan-fiber-api/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test ./... -cover

  uji-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-pemweb2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-pemweb2/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
